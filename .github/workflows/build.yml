name: Build APK
on:
  workflow_dispatch:
    inputs:
      build_id: { required: true }
      app_name: { required: true }
      url: { required: true }
      package: { required: true }
      color: { required: false, default: "#2563eb" }
      feed: { required: false, default: "" }
      icon_b64: { required: true }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Write app settings
        env:
          URL: ${{ inputs.url }}
          COLOR: ${{ inputs.color }}
          FEED: ${{ inputs.feed }}
          ICON: ${{ inputs.icon_b64 }}
        run: |
          jq -n --arg url "$URL" --arg color "$COLOR" --arg feed "$FEED" '{url:$url,color:$color,feed:$feed}' > app/src/main/assets/config.json
          echo "$ICON" | base64 -d > app/src/main/res/mipmap/ic_launcher.png
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > release.jks
          else keytool -genkeypair -keystore release.jks -alias w2a -storepass w2apass -keypass w2apass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=WebApp"; fi
      - name: Build
        env:
          APP_NAME: ${{ inputs.app_name }}
          PKG: ${{ inputs.package }}
        run: gradle :app:assembleRelease "-PappName=$APP_NAME" "-PappId=$PKG" --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk app.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.build_id }}
          name: ${{ inputs.app_name }}
          files: app.apk
