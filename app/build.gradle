plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
  namespace 'com.mywebapp.app'
  compileSdk 34
  defaultConfig {
    applicationId project.findProperty("appId") ?: "com.mywebapp.app"
    minSdk 21
    targetSdk 34
    versionCode 1
    versionName "1.0"
    resValue "string", "app_name", project.findProperty("appName") ?: "My App"
  }
  signingConfigs {
    rel { storeFile file("../release.jks"); storePassword "w2apass"; keyAlias "w2a"; keyPassword "w2apass" }
  }
  buildTypes { release { minifyEnabled false; crunchPngs false; signingConfig signingConfigs.rel } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = "17" }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
